<html>
	<head>
		<title>WebSockets to Java via websockify</title>
		<script>
			const socket = new WebSocket("wss://localhost:9001");
			socket.onopen = (event) => {
				output = document.getElementById("output");
				output.innerHTML += "Socket opened.\n";
				var string = "I am WebSocket!\n";
				socket.send(string);
				output.innerHTML += "Sent: " + string + "\n";
			};
			socket.onmessage = (event) => {
				output = document.getElementById("output");
				output.innerHTML += "Received: " + event.data + "\n";
			};
			socket.onerror = (error) => {
				output = document.getElementById("output");
				output.innerHTML += "Error: " + error + "\n";
			};
			socket.onclose = (event) => {
				output = document.getElementById("output");
				output.innerHTML += "Socket closed.\n";
			};
		</script>
	</head>
	<body>
		<h1>WebSockets to Java via websockify</h1>
		<P>This page tries to open a secure WebSocket on port 9001 to the Java echo server.</p>
		<pre id="output"></pre>
	</body>
</html>
